_                   ignore                                                                      #menu: Navigation > -
_                   cycle chapter; show-text "Chapter: ${chapter}"                                 #menu: Navigation > Cycle chapter #@chapters
E                   cycle edition; show-text "Edition: ${edition}"                                 #menu: Navigation > Cycle edition #@editions
Home                seek 0 absolute                                                             #menu: Navigation > Go to start
Pgup                add chapter -1                                                              #menu: Navigation > Previous chapter
Pgdwn               add chapter 1                                                               #menu: Navigation > Next chapter
_                   ignore                                                                      #menu: Navigation > -
l                   ab-loop                                                                     #menu: Navigation > Set/Clear A-B loop
