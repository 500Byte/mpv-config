## Right-click menu (dynamic_menu) and key bindings

Ctrl+o              script-binding uosc/open-file                                               #menu: Open File...
Ctrl+O              script-binding file_browser/browse-files; script-message-to file_browser dynamic/reload                                        #menu: Open Folder...
_                   ignore                                                                      #menu: Playlist #@playlist
_                   script-binding recentmenu/open                                              #menu: Recent #@recent
_                   ignore                                                                      #menu: -
_                   set video-aspect-override "16:9";   show-text "Aspect: ${video-aspect-override}"                              #menu: Aspect Ratio > 16:9   #@state=(video_aspect_override==16.0/9.0 and 'checked')
_                   set video-aspect-override "4:3";    show-text "Aspect: ${video-aspect-override}"                              #menu: Aspect Ratio > 4:3    #@state=(video_aspect_override==4.0/3.0  and 'checked')
_                   set video-aspect-override "2.35:1"; show-text "Aspect: ${video-aspect-override}"                              #menu: Aspect Ratio > 2.35:1 #@state=(video_aspect_override==2.35     and 'checked')
_                   ignore                                                                                                      #menu: Aspect Ratio > -
A                   cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"; show-text "Aspect: ${video-aspect-override}"   #menu: Aspect Ratio > Cycle aspect ratio
_                   set video-aspect-override "no"; show-text "Aspect: ${video-aspect-override}"                                  #menu: Aspect Ratio > Reset
_                   set speed 2.0;  show-text "Speed: ${speed}"                                  #menu: Playback Speed > 2.0  #@state=(speed==2.0  and 'checked')
_                   set speed 1.5;  show-text "Speed: ${speed}"                                  #menu: Playback Speed > 1.5  #@state=(speed==1.5  and 'checked')
_                   set speed 1.25; show-text "Speed: ${speed}"                                  #menu: Playback Speed > 1.25 #@state=(speed==1.25 and 'checked')
_                   set speed 1.0;  show-text "Speed: ${speed}"                                  #menu: Playback Speed > 1.0  #@state=(speed==1.0  and 'checked')
_                   set speed 0.75; show-text "Speed: ${speed}"                                  #menu: Playback Speed > 0.75 #@state=(speed==0.75 and 'checked')
_                   set speed 0.5;  show-text "Speed: ${speed}"                                  #menu: Playback Speed > 0.5  #@state=(speed==0.5  and 'checked')
_                   ignore                                                                      #menu: Playback Speed > -
]                   add speed  0.1; show-text "Speed: ${speed}"                                  #menu: Playback Speed > Speed +0.1
[                   add speed -0.1; show-text "Speed: ${speed}"                                  #menu: Playback Speed > Speed -0.1
}                   multiply speed 2.0; show-text "Speed: ${speed}"                              #menu: Playback Speed > Speed ×2
{                   multiply speed 0.5; show-text "Speed: ${speed}"                              #menu: Playback Speed > Speed ×0.5
_                   ignore                                                                      #menu: Playback Speed > -
BS                  set speed 1.0; show-text "Speed: ${speed}"                                   #menu: Playback Speed > Reset
Up                  no-osd add volume  5; show-text "Volume: ${volume}%"                          #menu: Volume > +5%
Down                no-osd add volume -5; show-text "Volume: ${volume}%"                          #menu: Volume > -5%
Shift+Up            no-osd add volume  2; show-text "Volume: ${volume}%"                          #menu: Volume > +2%
Shift+Down          no-osd add volume -2; show-text "Volume: ${volume}%"                          #menu: Volume > -2%
_                   ignore                                                                      #menu: Volume > -
m                   cycle mute; show-text "${?mute==yes:Muted}${?mute==no:Unmuted}"             #menu: Volume > Mute #@state=(mute and 'checked')
_                   no-osd set volume 100; set mute no; show-text "Volume: ${volume}%"            #menu: Volume > Reset
s                   screenshot                                                                  #menu: Screenshot > Save to directory (with subs)
S                   screenshot video                                                            #menu: Screenshot > Save to directory
Ctrl+s              screenshot window                                                           #menu: Screenshot > Save to directory (window)
Alt+s               screenshot each-frame                                                       #menu: Screenshot > Save each frame to directory
_                   ignore                                                                      #menu: Screenshot > -
c                   script-binding clipshot/clipshot-subs                                       #menu: Screenshot > Copy to clipboard (with subs)
C                   script-binding clipshot/clipshot-video                                      #menu: Screenshot > Copy to clipboard
Ctrl+c              script-binding clipshot/clipshot-window                                     #menu: Screenshot > Copy to clipboard (window)
_                   ignore                                                                      #menu: -
Shift+Right         seek +1                                                                     #menu: Navigation > Seek > Forward 1s
Shift+Left          seek -1                                                                     #menu: Navigation > Seek > Back 1s
Right               seek +5                                                                     #menu: Navigation > Seek > Forward 5s
Left                seek -5                                                                     #menu: Navigation > Seek > Back 5s
Ctrl+Right          seek +60                                                                    #menu: Navigation > Seek > Forward 60s
Ctrl+Left           seek -60                                                                    #menu: Navigation > Seek > Back 60s
