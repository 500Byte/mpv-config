Shift+Pgup          seek -600                                                                   #menu: Navigation > Seek > Back 10min
_                   ignore                                                                      #menu: Navigation > Seek > -
,                   frame-back-step                                                             #menu: Navigation > Seek > Previous frame
.                   frame-step                                                                  #menu: Navigation > Seek > Next frame
_                   ignore                                                                      #menu: Navigation > Seek > -
Ctrl+Shift+Left     no-osd sub-seek -1                                                          #menu: Navigation > Seek > Seek to previous subtitle
Ctrl+Shift+Right    no-osd sub-seek  1                                                          #menu: Navigation > Seek > Seek to next subtitle
_                   ignore                                                                      #menu: Navigation > Seek > -
Shift+BS            revert-seek                                                                 #menu: Navigation > Seek > Revert (or marked) seek
