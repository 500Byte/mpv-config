# Scroll danmaku display duration (seconds)
scrolltime=15
# Fixed danmaku display duration (seconds)
fixtime=5
# Use fps video filter to improve danmaku smoothness
vf_fps=yes
# FPS filter value for your display refresh rate
fps=165/1.001
# Font name (no quotes)
fontname=微软雅黑
# Font size
fontsize=40
# Shadow
shadow=0
# Bold
bold=no
# Opacity (0.0-1.0)
opacity=0.8
# Danmaku display area (0.0-1.0)
displayarea=0.3
# Outline 0-4
outline=2
# Danmaku blacklist file path (black.txt); absolute or relative. One pattern per line, Lua regex supported
blacklist_path=
# Danmaku history file path
history_path=~~/cache/danmaku-history.json