# Socket path (leave empty for auto)
socket=

# Thumbnail cache path (leave empty for auto)
thumbnail=

# Max thumbnail size in pixels (scaled to fit)
# Scales with hidpi when enabled
max_height=200
max_width=200

# Overlay ID
overlay_id=42

# Spawn thumbnailer on file load for faster initial thumbnails. Default off
spawn_first=no

# Quit thumbnail process after this many seconds of inactivity; 0 = disabled
quit_after_inactivity=0

# Enable for network playback. Default off
network=no

# Enable for audio-only playback. Default off
audio=no

# Use hardware decoding for thumbnails. Default off
# HW decode can speed up on high-end GPUs but may cause issues on low-end
hwdec=yes

# Custom path to mpv executable. Default: mpv
mpv_path=mpv

# Video extension blacklist; these extensions are skipped for thumbnails
blacklist_ext=bdmv,ifo

## Paths/dirs to exclude (e.g. slow network mounts)
## Windows example: excluded_dir=["X:", "Z:", "F:/Download/", "Download"]
#excluded_dir=[]
