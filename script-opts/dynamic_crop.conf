# [0-4] 0=off, 1=on demand, 2=single start, 3=auto manual, 4=auto start
mode=3
# Delay in seconds before crop (for mode 2), e.g. skip intro
start_delay=0
# Seconds
prevent_change_timer=30
# [0-3]; off when prevent_change_timer=0. 0=off, 1=keep max, 2=keep min, 3=keep latest
prevent_change_mode=0
# Avoid window resize to source when crop changes in windowed/maximized. 0=no fix (recommended), 1=keep size, 2=keep width, 3=keep height. Default 1
fix_windowed_behavior=0
# Seconds. 0 = 1 frame min. Default 0.2
fast_change_timer=0.2
# Seconds. 0 = disabled. Default 0.5
limit_timer=0.5
# Seconds. Default 2
ratio_timer=2
# Seconds. >= ratio_timer. Default 20, offset for asymmetric video
offset_timer=20
# Seconds. >= offset_timer; 0=disabled. Default 40, fallback when ratio not in list
fallback_timer=40
# Integer, scale with detect_round to match source width/height
linked_tolerance=2
# Space-separated ratio list
ratios=2.76 2.55 24/9 2.4 2.39 2.35 2.2 2.1 2 1.9 1.85 16/9 5/3 1.5 1.43 4/3 1.25 9/16 9/18 9/21
# Even number; tune to match ratio list. Default 2
ratio_tolerance=2
# [0-2] Default 0=off, 1=fast_change_timer, 2=ratio_timer
read_ahead_mode=0
# Integer/frames, read-ahead. Default 0
read_ahead_sync=0
# [0.0-1] Extra time to allow new metadata to be segmented; 0=strict continuous only (disable)
segmentation=0.5
# Crop method: 0=lavfi-crop (ffmpeg), 1=video-crop (mpv/VO). Default 1
crop_method=1
# See https://ffmpeg.org/ffmpeg-filters.html#cropdetect
## Max black level; increase slowly if light black remains
detect_limit=26
# Even number
detect_round=2
# Debug
debug=no