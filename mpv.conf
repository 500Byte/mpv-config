########
# UI   #
########

# Window
border=yes
no-title-bar
ontop=no
keepaspect=yes
keepaspect-window=no
geometry=1792x1008

osc=no
load-select=no
load-stats-overlay=no
script-opts=stats-persistent_overlay=yes

# OSD
osd-fractions=yes
osd-duration=2000
osd-scale-by-window=yes

# OSD progress bar style (window mode always shows osd-bar.lua)
osd-bar-w=100
osd-bar-h=0.4
osd-bar-align-y=1
osd-bar-border-size=0

########
# Playback #
########

idle=yes
keep-open=yes
save-position-on-quit=yes
watch-later-options=start,edition,volume,aid,vid,sid,secondary-sid

loop-playlist=inf
autocreate-playlist=same
directory-mode=ignore

hr-seek=default
input-ime=no
input-default-bindings=no
input-doubleclick-time=170

########
# Video #
########

vo=gpu-next
gpu-api=vulkan
gpu-context=waylandvk
hwdec=auto-copy
hwdec-codecs=h264,hevc,vp8,vp9,av1

# Dithering
dither-depth=auto
dither=error-diffusion
error-diffusion=floyd-steinberg

glsl-shader-cache=yes

########
# Audio #
########

ao=pipewire
volume=100
volume-max=200
audio-channels=stereo
audio-file-auto=fuzzy
alang=en,eng,es,spa

########
# Subtitles #
########

sub-auto=fuzzy
slang=es,spa,en,eng
sub-file-paths=sub;subs;subtitles
sub-font="Noto Sans"
sub-font-size=40
sub-bold=no
sub-color="#FFFFFF"
sub-outline-size=1.5
sub-outline-color="#000000"
sub-shadow-offset=0
sub-back-color="#000000"

########
# Screenshot #
########

screenshot-format=jpg
screenshot-jpeg-quality=100
screenshot-tag-colorspace=no
screenshot-high-bit-depth=no
screenshot-template="~/Pictures/Screenshots/mpv-shot-%{media-title}-%P-%n"

########
# Cache #
########

watch-later-dir="~~/cache/watch_later"
gpu-shader-cache-dir="~~/cache/shader"
icc-cache-dir="~~/cache/icc"
log-file="~~/cache/mpv.log"


##################
# Profiles #
##################

profile=Target
profile=Tscale
profile=HQ
profile=DeBand-low
profile=HDR2SDR
profile=NNEDI3+

##############
# Regular profiles #
##############

[Target]
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
 target-contrast=auto

[Tscale]
 video-sync=display-resample
 interpolation
 tscale=sphinx
 tscale-blur=0.65

[HQ]
 scale=ewa_lanczossharp
 cscale=catmull_rom
 dscale=mitchell
 scale-antiring=0.5
 dscale-antiring=0.5
 linear-upscaling=no
 sigmoid-upscaling=yes
 correct-downscaling=yes
 linear-downscaling=no
 deband=no

[DeBand-low]
 profile-desc=DeBand low
 deband-iterations=1
 deband-threshold=48
 deband-range=16
 deband-grain=16

[DeBand-medium]
 profile-desc=deband medium
 deband-iterations=2
 deband-threshold=64
 deband-range=16
 deband-grain=24

[DeBand-high]
 profile-desc=deband high
 deband-iterations=3
 deband-threshold=64
 deband-range=16
 deband-grain=24

[HDR2SDR]
 profile-desc=HDR to SDR mapping
 tone-mapping=auto
 gamut-mapping-mode=auto
 hdr-contrast-recovery=0.30
 hdr-compute-peak=auto
 hdr-peak-percentile=99.995
 hdr-peak-decay-rate=20
 hdr-scene-threshold-low=1.0
 hdr-scene-threshold-high=3.0
 allow-delayed-peak-detect=no

[NNEDI3+]
 profile-desc=FSRCNNX upscale with adaptive sharpen
 glsl-shaders="~~/shaders/FSRCNNX/FSRCNNX_x2_16_0_4_1.glsl"
 glsl-shaders-append="~~/shaders/Adaptive_sharpen/Adaptive_sharpen_lite_luma_RT.glsl"

##############
# Conditional profiles #
##############

[Deband]
 profile-desc=Enable deband for sources below YUV420P10
 profile-cond=get("video-params/average-bpp") < 24
 profile-restore=copy
 deband=yes

[hdr-2390]
 profile-cond=p.tone_mapping == "bt.2390" and p.current_vo == "gpu-next"
 profile-restore=copy
 tone-mapping-param=2.0

[peak-percentile]
 profile-cond=get("video-params/avg-pq-y") < 0.21 and p.current_vo == "gpu-next"
 profile-restore=copy
 hdr-peak-percentile=99.8

[SDR-gamut]
 profile-desc=SDR content gamut mapping
 profile-cond=get("video-params/primaries") ~= "bt.709" and get("video-params/gamma") == "bt.1886"
 profile-restore=copy
 gamut-mapping-mode=clip

[SDR-target]
 profile-desc=SDR display target
 profile-cond=not get("video-params/max-luma") and not get("inverse-tone-mapping") and p.current_vo == "gpu-next"
 profile-restore=copy
 target-colorspace-hint=no

[HDR]
 profile-desc=HDR config
 profile-cond=get("video-params/max-luma") > 203
 profile-restore=copy
 target-peak=auto
 target-colorspace-hint=auto
 target-colorspace-hint-mode=target
 hdr-reference-white=100
 blend-subtitles=no
 deband=no
 vf=""

[HDR-PASS]
 profile-desc=HDR passthrough, only when display is in HDR mode
 profile-cond=get("video-params/max-luma") > 203 and get("video-target-params/max-luma") > 203 and p.current_vo == "gpu-next"
 profile-restore=copy
 icc-profile=""
 icc-profile-auto=no
 target-colorspace-hint=auto
 target-colorspace-hint-mode=target
 inverse-tone-mapping=no
 target-prim=auto
 target-trc=auto
 target-peak=auto
 target-contrast=auto

[video-sync]
 profile-desc=Change A/V sync when speed exceeds threshold to avoid pitch shift
 profile-cond=(speed * audio_speed_correction) > 0 and ((speed * audio_speed_correction) < 0.96 or (speed * audio_speed_correction) > 1.04) and not (get("estimated-vf-fps") > 47 or get("display-fps") > 120)
 profile-restore=copy-equal
 video-sync=display-tempo

[fps-fix]
 profile-desc=Fix high framerate/refresh causing high power or dropped frames
 profile-cond=get("estimated-vf-fps") > 47 or get("display-fps") > 120
 profile-restore=copy
 video-sync=audio

[8k-fix]
 profile-desc=Use auto-safe hwdec for 8k to avoid dropped frames
 profile-cond=get("video-params/w") > 7000 or get("video-params/h") > 3000
 profile-restore=copy
 hwdec=auto-safe
 video-sync=audio

[pgs-fix]
 profile-desc=PGS fix - stretch image subs to screen
 profile-cond=get("video-params/aspect") > 16 / 9
 profile-restore=copy
 stretch-image-subs-to-screen=yes

[low-res]
 profile-desc=Shader upscale for 720p/1080p content
 profile-cond=get("video-params/w") <= 1920
 profile-restore=copy
 glsl-shaders="~~/shaders/FSRCNNX/FSRCNNX_x2_16_0_4_1.glsl"
 glsl-shaders-append="~~/shaders/Adaptive_sharpen/Adaptive_sharpen_lite_luma_RT.glsl"

[high-res]
 profile-desc=Disable shaders for 4K+ (performance)
 profile-cond=get("video-params/w") > 2560
 profile-restore=copy
 glsl-shaders=""

[pause]
 profile-desc=Unpin when paused
 profile-cond=pause
 profile-restore=copy
 ontop=no

[maximized]
 profile-desc=Disable auto window resize when maximized
 profile-cond=window_maximized and vid and not get("current-tracks/video/albumart")
 profile-restore=copy-equal
 auto-window-resize=no

[minimized]
 profile-desc=Pause when minimized
 profile-cond=window_minimized and vid and not get("current-tracks/video/albumart")
 profile-restore=copy-equal
 pause

[end]
 profile-desc=Exit fullscreen when playlist ends
 profile-cond=idle_active
 no-fullscreen
 no-window-maximized

[audio]
 profile-desc=Music / audio-only
 profile-cond=aid and (not vid or get("current-tracks/video/albumart"))
 profile-restore=copy
 prefetch-playlist
 loop-playlist=inf
 script-opts=modernz-visibility=always
 watch-later-options=edition,volume,aid,vid,sid,secondary-sid
 glsl-shaders=" "
